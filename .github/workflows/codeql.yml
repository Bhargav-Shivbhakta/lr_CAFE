name: Code scanning

# GitHub's CodeQL reads the JavaScript/TypeScript for security bugs (injection, unsafe data handling…).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 14 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
